<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link not found - URL Shortener</title>
  <style>
    :root { color-scheme: light; font-family: 'Segoe UI', system-ui, sans-serif; color: #2e2536; background: #f0ebf5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 40rem; margin: 0 auto; padding: clamp(3rem, 10vw, 6rem) 1.5rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin: 0 0 1rem; }
    p { color: #66576f; line-height: 1.6; margin: 0 0 2rem; }
    a { display: inline-block; padding: 0.75rem 0; color: #4b365f; text-underline-offset: 0.2em; }
    a:hover { color: #382547; }
    a:focus-visible { outline: 3px solid #4b365f; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Link not found</h1>
    <p>This short link does not exist. Check the address and try again.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
