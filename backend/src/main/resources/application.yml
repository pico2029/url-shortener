shortener:
  analytics:
    queue-capacity: ${ANALYTICS_QUEUE_CAPACITY:1000}
  public-base-url: ${SHORTENER_PUBLIC_BASE_URL:http://localhost:8080}
  redirect-cache:
    enabled: ${REDIRECT_CACHE_ENABLED:true}
    ttl: ${REDIRECT_CACHE_TTL:5m}
spring:
  application:
    name: url-shortener
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/shortener}
    username: ${DATABASE_USER:shortener}
    password: ${DATABASE_PASSWORD:shortener-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:100ms}
      timeout: ${REDIS_TIMEOUT:100ms}
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
