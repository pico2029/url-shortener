name: url-shortener

services:
  backend-tests:
    profiles: ["test"]
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_TOOL_OPTIONS: "-Dapi.version=${DOCKER_API_VERSION:-1.44}"
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: url-shortener-backend:0.0.1
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shortener}
      DATABASE_USER: ${POSTGRES_USER:-shortener}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-shortener-local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ingress
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: url-shortener-frontend:0.0.1
    build: ./frontend
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ingress
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  ingress:
  data:
    internal: true

volumes:
  postgres-data:
  maven-cache:
